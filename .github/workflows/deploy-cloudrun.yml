# Deploy API lên Cloud Run khi push main (cần GitHub secrets GCP)
# Secrets: GCP_PROJECT_ID, GCP_SA_KEY (JSON service account có quyền run.admin + artifactregistry)
name: Deploy Cloud Run API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cloudrun.yml'

jobs:
  deploy:
    name: Cloud Run trangtran-api
    runs-on: ubuntu-latest
    if: github.repository == 'LLLVPN4423/Trang_Tran_Web'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy trangtran-api \
            --source ./backend \
            --region asia-southeast1 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --quiet
