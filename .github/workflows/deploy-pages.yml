# Deploy frontend/dist lên Cloudflare Pages (đủ CSS+JS, tránh index lệch asset)
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Vars (optional repo variables): VITE_API_URL, VITE_FIREBASE_* , VITE_SEPAY_*
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Pages trangtran-hair
    runs-on: ubuntu-latest
    if: github.repository == 'LLLVPN4423/Trang_Tran_Web' && secrets.CLOUDFLARE_API_TOKEN != ''
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        run: npm run install:all && npm run build:frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_SEPAY_BANK_NAME: ${{ vars.VITE_SEPAY_BANK_NAME }}
          VITE_SEPAY_BANK_BIN: ${{ vars.VITE_SEPAY_BANK_BIN }}
          VITE_SEPAY_ACCOUNT_NUMBER: ${{ vars.VITE_SEPAY_ACCOUNT_NUMBER }}
          VITE_SEPAY_ACCOUNT_NAME: ${{ vars.VITE_SEPAY_ACCOUNT_NAME }}

      - name: Publish to Cloudflare Pages (dist + functions proxy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=trangtran-hair --branch=main
