# Production deployment
# Usage: cp .env.production.example .env && docker compose -f docker-compose.prod.yml up -d --build
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID}
      Firebase__CredentialsPath: /app/secrets/firebase-credentials.json
      SePay__WebhookSecret: ${SEPAY_WEBHOOK_SECRET}
      Cors__Origins__0: ${FRONTEND_URL:-http://localhost}
    volumes:
      - ${FIREBASE_CREDENTIALS_PATH}:/app/secrets/firebase-credentials.json:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_SEPAY_BANK_NAME: ${VITE_SEPAY_BANK_NAME:-Vietcombank}
        VITE_SEPAY_ACCOUNT_NUMBER: ${VITE_SEPAY_ACCOUNT_NUMBER}
        VITE_SEPAY_ACCOUNT_NAME: ${VITE_SEPAY_ACCOUNT_NAME}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
