# Development — hot reload (Vite dev + .NET watch via npm run dev:all recommended)
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      SePay__WebhookSecret: ${SEPAY_WEBHOOK_SECRET:-dev-webhook-secret}
    volumes:
      - ./backend/src/TrangTranHair.Api/appsettings.Development.json:/app/appsettings.Development.json:ro

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    depends_on:
      - api
